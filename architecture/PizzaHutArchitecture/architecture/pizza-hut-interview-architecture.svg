<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description">
  <title id="title">Pizza Hut StoreOS extension architecture</title>
  <desc id="description">Interview-ready architecture showing the React kiosk and seller UI, Express FDK backend, Fynd platform APIs, MongoDB, Redis, authentication, payment and order flow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9fc"/>
      <stop offset="1" stop-color="#eef3fa"/>
    </linearGradient>
    <linearGradient id="pizza" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e91839"/>
      <stop offset="1" stop-color="#b50f2a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#20304a" flood-opacity=".12"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 12 6 L 0 12 z" fill="#1976d2"/></marker>
    <marker id="arrow-purple" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 12 6 L 0 12 z" fill="#7455d9"/></marker>
    <marker id="arrow-teal" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 12 6 L 0 12 z" fill="#008c84"/></marker>
    <marker id="arrow-gray" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 12 6 L 0 12 z" fill="#697586"/></marker>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#17253b}.subtitle{font:400 16px Arial,sans-serif;fill:#52637a}.section{font:700 17px Arial,sans-serif;letter-spacing:1.1px;fill:#34455d}.heading{font:700 20px Arial,sans-serif;fill:#17253b}.subheading{font:700 15px Arial,sans-serif;fill:#26384f}.body{font:400 14px Arial,sans-serif;fill:#41536a}.small{font:400 12px Arial,sans-serif;fill:#52637a}.tiny{font:400 11px Arial,sans-serif;fill:#52637a}.white{fill:#fff}.card{fill:#fff;stroke:#d7e0ec;stroke-width:1.2}.card-blue{fill:#f3f8ff;stroke:#a9c9ed;stroke-width:1.3}.card-purple{fill:#f8f5ff;stroke:#cdbff7;stroke-width:1.3}.card-teal{fill:#f0fbf9;stroke:#a4dcd5;stroke-width:1.3}.card-red{fill:#fff4f5;stroke:#f0b7c2;stroke-width:1.3}.label{font:700 11px Arial,sans-serif;letter-spacing:.65px;fill:#506078}.pill{font:700 11px Arial,sans-serif;fill:#fff}.step{font:700 15px Arial,sans-serif;fill:#17253b}.stepbody{font:400 12px Arial,sans-serif;fill:#41536a}.lineblue{fill:none;stroke:#1976d2;stroke-width:2.2;marker-end:url(#arrow-blue)}.linepurple{fill:none;stroke:#7455d9;stroke-width:2.2;marker-end:url(#arrow-purple)}.lineteal{fill:none;stroke:#008c84;stroke-width:2.2;marker-end:url(#arrow-teal)}.linegray{fill:none;stroke:#697586;stroke-width:1.7;stroke-dasharray:6 5;marker-end:url(#arrow-gray)}.divider{stroke:#d9e3ef;stroke-width:1.2}.dash{fill:none;stroke:#91a0b5;stroke-width:1.4;stroke-dasharray:5 5}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- Header -->
  <rect x="48" y="34" width="13" height="58" rx="6" fill="url(#pizza)"/>
  <text x="80" y="62" class="title">Pizza Hut StoreOS — application architecture</text>
  <text x="80" y="88" class="subtitle">Repository-derived view: self-service kiosk &amp; seller console · Fynd extension · payment and order journey</text>
  <rect x="1532" y="43" width="337" height="39" rx="19" fill="#17253b"/>
  <text x="1700" y="68" class="pill" text-anchor="middle">INTERVIEW ARCHITECTURE · AUG 2026</text>

  <!-- Main diagram labels -->
  <text x="55" y="134" class="section">ACTORS</text>
  <text x="361" y="134" class="section">FYND EXTENSION EDGE</text>
  <text x="675" y="134" class="section">PIZZA HUT EXTENSION SERVICE</text>
  <text x="1392" y="134" class="section">PLATFORM &amp; CONNECTED SERVICES</text>

  <!-- Actors -->
  <g filter="url(#shadow)">
    <rect x="50" y="156" width="250" height="119" rx="14" class="card"/>
    <circle cx="85" cy="191" r="17" fill="#e91839"/>
    <path d="M85 181a6 6 0 1 1 0 12a6 6 0 0 1 0-12m-11 28c1-8 7-12 11-12s10 4 11 12" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <text x="115" y="187" class="heading">Customer / Kiosk</text>
    <text x="115" y="210" class="body">Menu, product, cart, checkout</text>
    <text x="115" y="230" class="body">QR payment &amp; order confirmation</text>
    <rect x="72" y="246" width="93" height="18" rx="9" fill="#fff0f2"/>
    <text x="118" y="259" class="label" text-anchor="middle" fill="#b50f2a">CUSTOMER FLOW</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="50" y="304" width="250" height="119" rx="14" class="card"/>
    <circle cx="85" cy="339" r="17" fill="#7455d9"/>
    <path d="M85 329a6 6 0 1 1 0 12a6 6 0 0 1 0-12m-11 28c1-8 7-12 11-12s10 4 11 12" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <text x="115" y="335" class="heading">Seller Admin</text>
    <text x="115" y="358" class="body">Applications, theme &amp; features</text>
    <text x="115" y="378" class="body">Store allowlist, media &amp; journey</text>
    <rect x="72" y="394" width="82" height="18" rx="9" fill="#f1edff"/>
    <text x="113" y="407" class="label" text-anchor="middle" fill="#6744cf">SELLER FLOW</text>
  </g>

  <!-- Edge -->
  <g filter="url(#shadow)">
    <rect x="355" y="156" width="274" height="267" rx="16" class="card-blue"/>
    <rect x="355" y="156" width="274" height="43" rx="16" fill="#1976d2"/>
    <rect x="355" y="183" width="274" height="16" fill="#1976d2"/>
    <text x="492" y="184" class="heading white" text-anchor="middle">Fynd Extension Gateway</text>
    <text x="383" y="228" class="subheading">Public extension route</text>
    <text x="383" y="249" class="body">/ext/fng-pizzahut/*</text>
    <line x1="378" y1="265" x2="606" y2="265" class="divider"/>
    <text x="383" y="291" class="subheading">Context &amp; session boundary</text>
    <text x="383" y="311" class="body">• injects x-application-data</text>
    <text x="383" y="331" class="body">• Fynd OAuth / session cookie</text>
    <text x="383" y="351" class="body">• platform proxy endpoints</text>
    <line x1="378" y1="365" x2="606" y2="365" class="divider"/>
    <text x="383" y="391" class="small">Ingress may forward the full or stripped</text>
    <text x="383" y="407" class="small">extension path; Express supports both.</text>
  </g>

  <!-- Service container -->
  <g filter="url(#shadow)">
    <rect x="668" y="156" width="685" height="526" rx="18" fill="#fff" stroke="#bfcde0" stroke-width="1.5"/>
    <rect x="668" y="156" width="685" height="52" rx="18" fill="url(#pizza)"/>
    <rect x="668" y="188" width="685" height="20" fill="url(#pizza)"/>
    <text x="696" y="187" class="heading white">Pizza Hut FDK Extension</text>
    <text x="1257" y="187" class="pill" text-anchor="end">Docker · Node 22 · Express/FIT</text>
  </g>

  <!-- Frontend within service -->
  <g filter="url(#shadow)">
    <rect x="690" y="227" width="310" height="278" rx="14" class="card-red"/>
    <rect x="706" y="243" width="120" height="23" rx="11" fill="#e91839"/>
    <text x="766" y="259" class="pill" text-anchor="middle">FRONTEND</text>
    <text x="707" y="291" class="heading">React + Vite SPA</text>
    <text x="707" y="316" class="body">React Router • Redux • Apollo</text>
    <text x="707" y="336" class="body">ApplicationClient (FDK client)</text>
    <line x1="707" y1="353" x2="983" y2="353" class="divider"/>
    <text x="707" y="378" class="subheading">Customer kiosk journey</text>
    <text x="707" y="399" class="body">Menu / PDP • Cart • Payment Options</text>
    <text x="707" y="419" class="body">QR Payment • Order Placed</text>
    <text x="707" y="446" class="subheading">Seller journey</text>
    <text x="707" y="467" class="body">Applications • Config • Store settings</text>
    <text x="707" y="487" class="body">Media manager</text>
  </g>

  <!-- Backend within service -->
  <g filter="url(#shadow)">
    <rect x="1019" y="227" width="312" height="278" rx="14" class="card-blue"/>
    <rect x="1035" y="243" width="116" height="23" rx="11" fill="#1976d2"/>
    <text x="1093" y="259" class="pill" text-anchor="middle">BACKEND</text>
    <text x="1036" y="291" class="heading">Express + FDK integration</text>
    <text x="1036" y="315" class="body">Request logging • 2 MB JSON limit</text>
    <text x="1036" y="335" class="body">Sentry request/error handlers</text>
    <line x1="1036" y1="353" x2="1312" y2="353" class="divider"/>
    <text x="1036" y="378" class="subheading">Custom REST APIs</text>
    <text x="1036" y="399" class="body">app-info • seller config • media</text>
    <text x="1036" y="419" class="body">payment modes / link / polling</text>
    <text x="1036" y="439" class="body">proxy setup • health • webhooks</text>
    <text x="1036" y="467" class="subheading">Business logic</text>
    <text x="1036" y="487" class="body">Validation • defaults • deep merge • FDK SDK</text>
  </g>

  <!-- data and security strip -->
  <g filter="url(#shadow)">
    <rect x="690" y="525" width="641" height="137" rx="14" class="card-teal"/>
    <text x="710" y="553" class="subheading">Data, authentication &amp; resilience</text>
    <line x1="710" y1="565" x2="1310" y2="565" class="divider"/>
    <rect x="710" y="582" width="172" height="60" rx="10" fill="#fff" stroke="#a4dcd5"/>
    <text x="727" y="606" class="subheading">MongoDB</text>
    <text x="727" y="626" class="small">journey_seller_config</text>
    <text x="727" y="640" class="tiny">theme, features, allowlist</text>
    <rect x="896" y="582" width="159" height="60" rx="10" fill="#fff" stroke="#a4dcd5"/>
    <text x="913" y="606" class="subheading">Redis</text>
    <text x="913" y="626" class="small">FDK multi-level session</text>
    <text x="913" y="640" class="tiny">storage / cache layer</text>
    <rect x="1068" y="582" width="243" height="60" rx="10" fill="#fff" stroke="#a4dcd5"/>
    <text x="1085" y="604" class="subheading">Auth &amp; identity</text>
    <text x="1085" y="624" class="small">Seller: Fynd OAuth + cookie session</text>
    <text x="1085" y="640" class="tiny">Customer: Fynd GraphQL password / SMS OTP</text>
  </g>

  <!-- right Platform -->
  <g filter="url(#shadow)">
    <rect x="1382" y="156" width="490" height="526" rx="18" class="card"/>
    <rect x="1382" y="156" width="490" height="43" rx="18" fill="#17253b"/>
    <rect x="1382" y="183" width="490" height="16" fill="#17253b"/>
    <text x="1627" y="184" class="heading white" text-anchor="middle">Fynd Platform &amp; connected services</text>

    <rect x="1401" y="218" width="451" height="102" rx="12" class="card-blue"/>
    <text x="1421" y="246" class="subheading">Application API — GraphQL</text>
    <text x="1421" y="268" class="body">Catalog &amp; menu · location · user authentication</text>
    <text x="1421" y="288" class="body">Cart · coupons · select payment mode · checkout · order</text>
    <rect x="1741" y="233" width="91" height="20" rx="10" fill="#1976d2"/>
    <text x="1787" y="247" class="pill" text-anchor="middle">BROWSER</text>

    <rect x="1401" y="337" width="451" height="91" rx="12" class="card-purple"/>
    <text x="1421" y="365" class="subheading">Platform APIs through backend FDK SDK</text>
    <text x="1421" y="387" class="body">POS payment routes · create / poll payment links</text>
    <text x="1421" y="407" class="body">Applications · stores · domains · file storage</text>
    <rect x="1741" y="352" width="91" height="20" rx="10" fill="#7455d9"/>
    <text x="1787" y="366" class="pill" text-anchor="middle">SERVER</text>

    <rect x="1401" y="445" width="218" height="138" rx="12" class="card-teal"/>
    <text x="1421" y="473" class="subheading">Fynd proxy services</text>
    <text x="1421" y="495" class="small">/ext/phm/proxy</text>
    <text x="1421" y="513" class="small">cart · voucher · checkout helpers</text>
    <text x="1421" y="537" class="small">/ext/sauce/proxy</text>
    <text x="1421" y="555" class="small">price · promise time</text>

    <rect x="1634" y="445" width="218" height="138" rx="12" class="card-red"/>
    <text x="1654" y="473" class="subheading">Other integrations</text>
    <text x="1654" y="495" class="small">WhatsApp OTP: /ext/notify</text>
    <text x="1654" y="513" class="small">Rewards: Fynd Engage GraphQL</text>
    <text x="1654" y="537" class="small">Analytics: GTM + Boltic</text>
    <text x="1654" y="555" class="small">Errors: Sentry (browser/server)</text>

    <line x1="1401" y1="603" x2="1852" y2="603" class="divider"/>
    <text x="1421" y="630" class="small">Order, payment state and fulfillment remain the Platform source of truth.</text>
    <text x="1421" y="651" class="small">The extension stores only its configuration and session-related data.</text>
  </g>

  <!-- Main directional connections -->
  <path d="M300 215 H355" class="lineblue"/>
  <text x="314" y="203" class="tiny">HTTPS</text>
  <path d="M300 363 H355" class="linepurple"/>
  <text x="306" y="351" class="tiny">OAuth entry</text>
  <path d="M629 240 H690" class="lineblue"/>
  <text x="633" y="229" class="tiny">SPA + APIs</text>
  <path d="M629 357 H690" class="linepurple"/>
  <path d="M1000 330 H1019" class="linegray"/>
  <text x="934" y="319" class="tiny">same-origin REST</text>
  <path d="M1000 385 C1165 385 1220 270 1401 270" class="lineblue"/>
  <text x="1178" y="295" class="tiny">GraphQL + proxy REST</text>
  <path d="M1331 384 H1401" class="linepurple"/>
  <text x="1339" y="373" class="tiny">FDK SDK</text>
  <path d="M1331 445 C1374 445 1375 382 1401 382" class="linepurple"/>
  <path d="M1331 592 H1382" class="lineteal"/>
  <text x="1338" y="581" class="tiny">events / telemetry</text>
  <path d="M1175 505 V582" class="lineteal"/>
  <path d="M807 505 V582" class="lineteal"/>
  <text x="824" y="552" class="tiny">config read/write</text>
  <path d="M1353 278 C1371 278 1370 207 1382 207" class="linegray"/>
  <text x="1273" y="220" class="tiny">webhook → backend</text>

  <!-- Divider -->
  <line x1="50" y1="711" x2="1870" y2="711" class="divider"/>
  <text x="55" y="753" class="section">CHECKOUT, PAYMENT &amp; ORDER — HAPPY PATH</text>
  <text x="1818" y="753" class="small" text-anchor="end">blue = browser/platform call · purple = backend-mediated payment call</text>

  <!-- Bottom path -->
  <g filter="url(#shadow)">
    <rect x="53" y="779" width="211" height="161" rx="14" class="card-blue"/>
    <circle cx="80" cy="806" r="13" fill="#1976d2"/><text x="80" y="811" class="pill" text-anchor="middle">1</text>
    <text x="103" y="811" class="step">Bootstrap context</text>
    <text x="73" y="840" class="stepbody">GET /api/app-info reads</text>
    <text x="73" y="858" class="stepbody">gateway application context;</text>
    <text x="73" y="876" class="stepbody">load seller config + allowlist</text>
    <text x="73" y="906" class="tiny">Redux receives token, app, store settings</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="296" y="779" width="211" height="161" rx="14" class="card-blue"/>
    <circle cx="323" cy="806" r="13" fill="#1976d2"/><text x="323" y="811" class="pill" text-anchor="middle">2</text>
    <text x="346" y="811" class="step">Browse &amp; build cart</text>
    <text x="316" y="840" class="stepbody">GraphQL gets menu/products.</text>
    <text x="316" y="858" class="stepbody">Cart writes use Fynd proxy</text>
    <text x="316" y="876" class="stepbody">endpoints and APIs.</text>
    <text x="316" y="906" class="tiny">catalog • pricing • promotions</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="539" y="779" width="211" height="161" rx="14" class="card-teal"/>
    <circle cx="566" cy="806" r="13" fill="#008c84"/><text x="566" y="811" class="pill" text-anchor="middle">3</text>
    <text x="589" y="811" class="step">Kiosk cart metadata</text>
    <text x="559" y="840" class="stepbody">Preserve cart metadata; set</text>
    <text x="559" y="858" class="stepbody">pickup, KIOSK source, contact</text>
    <text x="559" y="876" class="stepbody">details and promise time.</text>
    <text x="559" y="906" class="tiny">business rules in paymentFlow.js</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="782" y="779" width="211" height="161" rx="14" class="card-blue"/>
    <circle cx="809" cy="806" r="13" fill="#1976d2"/><text x="809" y="811" class="pill" text-anchor="middle">4</text>
    <text x="832" y="811" class="step">Select &amp; checkout</text>
    <text x="802" y="840" class="stepbody">GraphQL selects payment mode,</text>
    <text x="802" y="858" class="stepbody">then checkoutCart builds pickup</text>
    <text x="802" y="876" class="stepbody">order and address payload.</text>
    <text x="802" y="906" class="tiny">Platform creates checkout state</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1025" y="779" width="211" height="161" rx="14" class="card-purple"/>
    <circle cx="1052" cy="806" r="13" fill="#7455d9"/><text x="1052" y="811" class="pill" text-anchor="middle">5</text>
    <text x="1075" y="811" class="step">Create QR payment link</text>
    <text x="1045" y="840" class="stepbody">React → Express endpoint →</text>
    <text x="1045" y="858" class="stepbody">FDK payment client creates link</text>
    <text x="1045" y="876" class="stepbody">with kiosk ordering headers.</text>
    <text x="1045" y="906" class="tiny">create-payment-link</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1268" y="779" width="211" height="161" rx="14" class="card-purple"/>
    <circle cx="1295" cy="806" r="13" fill="#7455d9"/><text x="1295" y="811" class="pill" text-anchor="middle">6</text>
    <text x="1318" y="811" class="step">Poll payment status</text>
    <text x="1288" y="840" class="stepbody">Kiosk polls Express; it calls</text>
    <text x="1288" y="858" class="stepbody">FDK payment client for the</text>
    <text x="1288" y="876" class="stepbody">payment-link status.</text>
    <text x="1288" y="906" class="tiny">polling-payment-link</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1511" y="779" width="359" height="161" rx="14" class="card-red"/>
    <circle cx="1538" cy="806" r="13" fill="#e91839"/><text x="1538" y="811" class="pill" text-anchor="middle">7</text>
    <text x="1561" y="811" class="step">Confirm order &amp; reset journey</text>
    <text x="1531" y="840" class="stepbody">Order Placed polls GraphQL order(orderId) for its display number,</text>
    <text x="1531" y="858" class="stepbody">items, payment and shipment status; purchase analytics is emitted.</text>
    <text x="1531" y="886" class="stepbody">On payment failure, the kiosk invokes failed-checkout cleanup.</text>
    <text x="1531" y="915" class="tiny">Platform is the source of truth for order &amp; fulfillment state.</text>
  </g>

  <!-- bottom arrows -->
  <path d="M264 859 H296" class="lineblue"/>
  <path d="M507 859 H539" class="lineblue"/>
  <path d="M750 859 H782" class="lineblue"/>
  <path d="M993 859 H1025" class="linepurple"/>
  <path d="M1236 859 H1268" class="linepurple"/>
  <path d="M1479 859 H1511" class="lineblue"/>

  <!-- Footnote -->
  <text x="55" y="1010" class="small">Scope note: this visual documents the Pizza Hut extension in this repository. It shows observed call paths and ownership, not an official full Fynd infrastructure diagram.</text>
  <text x="55" y="1033" class="tiny">Evidence: services/pizza-hut/server.js, index.js, backend/seller-config/, frontend/App.jsx, frontend/graphql/, frontend/helper/paymentFlow.js, frontend/pages/QRPayment/ and OrderPlaced/.</text>
</svg>
